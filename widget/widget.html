<section class="luxx-listening" aria-live="polite">
  <div class="luxx-listening__top">
    <span class="luxx-listening__brand">LUXX</span>
    <span id="luxx-status" class="luxx-listening__status">OFFLINE</span>
  </div>
  <div class="luxx-listening__body">
    <img id="luxx-cover" class="luxx-listening__cover" src="" alt="Album cover" hidden>
    <div class="luxx-listening__meta">
      <p class="luxx-listening__eyebrow">NOW PLAYING</p>
      <h2 id="luxx-title">Currently not listening</h2>
      <p id="luxx-artist" class="luxx-listening__artist">—</p>
      <p id="luxx-album" class="luxx-listening__album"></p>
    </div>
  </div>
</section>
<link rel="stylesheet" href="luxx-listening.css">
<script src="luxx-listening.js" defer></script>
