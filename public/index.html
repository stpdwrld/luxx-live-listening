<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  <meta name="description" content="LUXX Live Listening — currently playing music.">

  <title>LUXX — Live Listening</title>

  <!-- FAVICON -->
  <link rel="icon" type="image/png"
    href="https://raw.githubusercontent.com/stpdwrld/bahanprof/main/logo.png">

  <!-- PRECONNECT -->
  <link rel="preconnect" href="https://ws.audioscrobbler.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- FONTS -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <main class="shell">

    <!-- HEADER -->
    <header class="topbar">
  <a class="brand" href="/">LUXX<span>.</span></a>

  <div class="header-actions">
    <div class="live-indicator">
      <i id="status-dot"></i>
      <span id="status-label">CHECKING</span>
    </div>

    <div class="menu-wrap">
      <button
        class="menu-toggle"
        id="menuToggle"
        aria-label="Open menu"
        aria-expanded="false"
        aria-controls="mainMenu"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="menu-dropdown" id="mainMenu">
        <a href="/stats">LISTENING STATS <span>↗</span></a>
      </nav>
    </div>
  </div>
</header>

    <!-- MAIN PLAYER -->
    <section class="main-content">

      <div class="cover-wrap">
        <img id="cover" src="/cover-placeholder.svg" alt="Album artwork">
        <div class="cover-glow"></div>
      </div>

      <div class="track-info">

        <div class="track-state">
          <span class="live-badge">LIVE</span>
          <p class="eyebrow" id="play-state">WAITING FOR MUSIC</p>
        </div>

        <h2 id="track-title">Nothing playing</h2>

        <p id="track-artist" class="artist">
          When playback starts, it will appear here.
        </p>

        <p id="track-album" class="album"></p>

        <a id="lastfm-link"
          class="track-link"
          href="#"
          target="_blank"
          rel="noreferrer"
          hidden>
          OPEN ON LAST.FM ↗
        </a>

      </div>

      <!-- VISUALIZER -->
      <section class="visualizer-section">

        <div class="visualizer" id="visualizer" aria-hidden="true"></div>

        <div class="visualizer-caption">
          <span></span>
          <p>LISTENING TO</p>
          <span></span>
        </div>

      </section>

    </section>

    <!-- BOTTOM PLAYER -->
    <footer class="bottom-player">

      <div class="mini-track">
        <img id="mini-cover" src="/cover-placeholder.svg" alt="">

        <div class="mini-info">
          <h3 id="mini-title">Nothing playing</h3>
          <p id="mini-artist">LUXX LIVE LISTENING</p>
        </div>
      </div>

      <div class="bottom-right">
        <span class="updated" id="updated">Waiting for update</span>

        <a id="bottom-link"
          class="bottom-link"
          href="#"
          target="_blank"
          rel="noreferrer"
          hidden>
          OPEN ON LAST.FM ↗
        </a>
      </div>

    </footer>

  </main>

  <script src="/script.js" defer></script>

  <!-- VISUALIZER + MINI PLAYER -->
  
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const $ = id => document.getElementById(id);

    const visualizer = $("visualizer");
    const cover = $("cover");
    const title = $("track-title");
    const artist = $("track-artist");
    const playState = $("play-state");
    const lastfmLink = $("lastfm-link");

    // CREATE EQUALIZER
    for (let i = 0; i < 35; i++) {
      const bar = document.createElement("span");

      bar.style.setProperty("--bar-height", `${15 + Math.random() * 85}%`);
      bar.style.setProperty("--duration", `${0.45 + Math.random() * 0.8}s`);
      bar.style.setProperty("--delay", `${Math.random() * -1.5}s`);

      visualizer.appendChild(bar);
    }

    // SYNC PLAYER DISPLAY
    function syncPlayer() {
      const playing = playState.textContent === "NOW PLAYING";

      visualizer.classList.toggle("is-playing", playing);

      $("mini-title").textContent = title.textContent;

      $("mini-artist").textContent = playing
        ? artist.textContent
        : "LUXX LIVE LISTENING";

      $("mini-cover").src = cover.src;

      if (!lastfmLink.hidden) {
        $("bottom-link").href = lastfmLink.href;
        $("bottom-link").hidden = false;
      } else {
        $("bottom-link").hidden = true;
      }
    }

    const observer = new MutationObserver(syncPlayer);

    [playState, cover, title, artist, lastfmLink].forEach(element => {
      observer.observe(element, {
        childList: true,
        characterData: true,
        subtree: true,
        attributes: true,
        attributeFilter: ["src", "href", "hidden"]
      });
    });

    syncPlayer();

    // HAMBURGER MENU
    const toggle = $("menuToggle");
    const menu = $("mainMenu");

    if (!toggle || !menu) return;

    function closeMenu() {
      toggle.setAttribute("aria-expanded", "false");
      menu.classList.remove("open");
    }

    toggle.addEventListener("click", () => {
      const isOpen = toggle.getAttribute("aria-expanded") === "true";

      toggle.setAttribute("aria-expanded", String(!isOpen));
      menu.classList.toggle("open", !isOpen);
    });

    document.addEventListener("click", event => {
      if (!event.target.closest(".menu-wrap")) {
        closeMenu();
      }
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeMenu();
    });
  });
</script>
</body>
</html>
