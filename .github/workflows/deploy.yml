
name: Deploy LUXX Live Listening

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Deploy Worker
        run: npx wrangler deploy --config ./wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USER: ${{ secrets.LASTFM_USER }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
        run: |
          set -e

          printf '%s' "$LASTFM_API_KEY" | npx wrangler versions secret put LASTFM_API_KEY --config ./wrangler.jsonc
          printf '%s' "$LASTFM_USER" | npx wrangler versions secret put LASTFM_USER --config ./wrangler.jsonc
          printf '%s' "$ADMIN_USERNAME" | npx wrangler versions secret put ADMIN_USERNAME --config ./wrangler.jsonc
          printf '%s' "$ADMIN_PASSWORD" | npx wrangler versions secret put ADMIN_PASSWORD --config ./wrangler.jsonc
          printf '%s' "$ADMIN_SESSION_SECRET" | npx wrangler versions secret put ADMIN_SESSION_SECRET --config ./wrangler.jsonc
