
name: Deploy LUXX Live Listening

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Deploy Worker
        run: npx wrangler deploy --config ./wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload Worker Secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REDIRECT_URI: ${{ secrets.SPOTIFY_REDIRECT_URI }}
          SPOTIFY_TOKEN_ENCRYPTION_KEY: ${{ secrets.SPOTIFY_TOKEN_ENCRYPTION_KEY }}

          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}

        run: |
          set -e

          for SECRET in \
            SPOTIFY_CLIENT_ID \
            SPOTIFY_CLIENT_SECRET \
            SPOTIFY_REDIRECT_URI \
            SPOTIFY_TOKEN_ENCRYPTION_KEY \
            ADMIN_PASSWORD \
            ADMIN_SESSION_SECRET
          do
            if [ -z "$(printenv "$SECRET")" ]; then
              echo "Missing GitHub Secret: $SECRET"
              exit 1
            fi

            printenv "$SECRET" | npx wrangler secret put "$SECRET" --config ./wrangler.jsonc
          done

          echo "All Worker secrets uploaded successfully."
