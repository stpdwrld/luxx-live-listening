
name: Deploy LUXX Live Listening

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Configure Worker Secrets
        env:
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USER: ${{ secrets.LASTFM_USER }}
        run: |
          printf '%s' "$ADMIN_USERNAME" | wrangler secret put ADMIN_USERNAME
          printf '%s' "$ADMIN_PASSWORD" | wrangler secret put ADMIN_PASSWORD
          printf '%s' "$ADMIN_SESSION_SECRET" | wrangler secret put ADMIN_SESSION_SECRET
          printf '%s' "$LASTFM_API_KEY" | wrangler secret put LASTFM_API_KEY
          printf '%s' "$LASTFM_USER" | wrangler secret put LASTFM_USER

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy
